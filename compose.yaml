services:
  filebrowser-ng:
    image: ghcr.io/dawidpiotrowski/filebrowser-ng:2.64.0-ng.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - files:/srv
      - database:/database
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  files:
  database:
