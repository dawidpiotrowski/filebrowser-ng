name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to verify
        type: string
        required: false
      linux_only:
        description: Verify Linux container releases without waiting for unrelated OS runners
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.linux_only == true && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go vet ./...
      - run: go test -race -timeout 5m ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      # One GHSA is locally patched and regression-tested; see the audit report.
      - run: pnpm audit --audit-level=low
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build the browser fixture server
        working-directory: .
        run: go build -o "$RUNNER_TEMP/filebrowser-ng" .
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify real multi-tab sessions and uploads
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tools/node_modules
        run: node e2e/browser-sessions.cjs "$RUNNER_TEMP/filebrowser-ng"

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  container:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: docker build --tag filebrowser-ng:ci .
      - name: Verify non-root container sessions, writes and restart persistence
        run: python3 scripts/container-smoke.py --image filebrowser-ng:ci --from-image ghcr.io/dawidpiotrowski/filebrowser-ng@sha256:abc2c21b9b852da040b5e7b691c784aebd96271c0bf294a8baa7f76848cb12c1
