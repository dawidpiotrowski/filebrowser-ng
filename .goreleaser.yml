version: 2
project_name: filebrowser-ng
builds:
  - env: [CGO_ENABLED=0]
    main: main.go
    binary: filebrowser-ng
    ldflags:
      - -s -w -X github.com/dawidpiotrowski/filebrowser-ng/v2/version.Version={{ .Version }} -X github.com/dawidpiotrowski/filebrowser-ng/v2/version.CommitSHA={{ .ShortCommit }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
# Release publication and container registries are configured independently.
# Never publish this fork to the upstream project's registries or Homebrew tap.
